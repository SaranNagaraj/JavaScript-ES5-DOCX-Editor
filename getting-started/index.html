<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />

    <script src="https://cdn.syncfusion.com/ej2/35.1.42/dist/ej2.min.js"></script>

    <link href="https://cdn.syncfusion.com/ej2/35.1.42/tailwind3.css" rel="stylesheet" />

    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            touch-action: none;
        }

        .stackblitz-container,
        .control-section {
            height: 100vh;
        }

        /* Main Layout */
        #documenteditor_container_body {
            display: flex;
            height: 100%;
            overflow: hidden;
        }

        /* Left Area */
        #editor-wrapper {
            flex: 0 0 70%;
            width: 70%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Custom Title Bar */
        #documenteditor_titlebar {
            height: 36px;
            line-height: 36px;
            width: 100%;
            background: #4f46e5;
            color: #ffffff;
            border-bottom: 1px solid #2B3481;
            padding-left: 15px;
            padding-right: 10px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 12px;
            flex-shrink: 0;
        }

        #documenteditor_title_contentEditor {
            display: inline-block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 95%;
        }

        /* DocumentEditor */
        #container {
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* Right Panel */
        #paste-panel {
            flex: 0 0 30%;
            width: 30%;
            padding: 12px;
            overflow: auto;
            box-sizing: border-box;
            border-left: 1px solid #ddd;
            background: #fff;
        }

        #paste-panel h3 {
            margin: 0 0 12px;
            font-size: 18px;
            font-weight: 600;
        }

        #paste-panel .e-btn {
            width: 100%;
            margin-bottom: 10px;
        }

        /* Existing title styles */
        .single-line {
            cursor: text !important;
            outline: none;
        }

        .single-line:hover {
            border-color: #e4e4e4 !important;
        }

        [contenteditable="true"].single-line {
            white-space: nowrap;
            border-color: #e4e4e4 !important;
        }
    </style>
</head>

<body>
    <div class="stackblitz-container tailwind3">

        <div class="control-section">

            <div id="documenteditor_container_body">

                <!-- Document Editor Area -->
                <div id="editor-wrapper">

                    <div id="documenteditor_titlebar" class="e-de-ctn-title">
                        <div id="documenteditor_title_contentEditor">
                        </div>
                    </div>

                    <div id="container"></div>

                </div>

                <!-- Paste Options -->
                <div id="paste-panel">

                    <button id="reset-document" class="e-btn">
        Reset Document
    </button>
<h3>Paste Options</h3>
                    <button id="paste-keep" class="e-btn">
                        Keep Source Formatting
                    </button>

                    <button id="paste-match" class="e-btn">
                        Match Destination Format
                    </button>

                    <button id="paste-text" class="e-btn">
                        Paste Text Only
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="index.js"></script>

    <script>
        window.addEventListener("beforeunload", onbeforeunload);

        function onbeforeunload() {
            return 'Want to save your changes?';
        }
    </script>
</body>
</html>
